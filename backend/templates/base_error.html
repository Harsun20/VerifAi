{% extends "base.html" %}
{% block title %}{{ code }}{% endblock %}
{% block content %}
<div class="error-state"><div class="error-code">{{ code }}</div><div class="eyebrow">REQUEST INTERRUPTED</div><h1>Access is <span>protected.</span></h1><p>{{ message }}</p><a class="btn btn-primary" href="{{ url_for('dashboard') if current_user else url_for('login') }}">Return to safety <i class="bi bi-arrow-up-right"></i></a></div>
{% endblock %}
