services:
  - type: web
    name: verifyai-sih26261-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 app:app
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: VERIFYAI_SEED_DEMO_DATA
        value: "true"
      - key: VERIFYAI_API_TOKEN_TTL
        value: "43200"
